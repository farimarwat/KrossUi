name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Lint and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Lint
        run: ./gradlew ktlintCheck
      - name: Build library and Android demo
        run: ./gradlew :krossui:compileAndroidMain :androidApp:assembleDebug

  ios:
    name: iOS build and API check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build library and iOS demo
        run: ./gradlew :krossui:compileKotlinIosArm64 :krossui:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosSimulatorArm64
      # Fails when the public API changes without running ./gradlew :krossui:updateKotlinAbi
      - name: Check public API
        run: ./gradlew :krossui:checkKotlinAbi
